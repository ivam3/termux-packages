# picom — Termux:X11 / mobile
# If laggy: comment picom out in bspwmrc and relaunch with `bspc wm -r`
backend = "xrender";
vsync = true;
shadow = false;
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = true;
