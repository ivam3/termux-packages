[colors]
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
primary = #7aa2f7
secondary = #bb9af7
alert = #f7768e
disabled = #565f89

[bar/main]
width = 100%
height = 38
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
font-0 = monospace:size=15;2
font-1 = monospace:size=15;2
modules-left = bspwm
modules-center = date
modules-right = cpu memory battery wifi pulseaudio
tray-position = none
override-redirect = true
wm-restack = bspwm
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
ws-icon-0 = I;1
ws-icon-1 = II;2
label-focused = %icon%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 1
label-occupied = %icon%
label-occupied-padding = 1
label-urgent = %icon%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%
label-warn = CPU %percentage%%
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 3
label = MEM %percentage_used%%

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 30

[module/wifi]
type = custom/script
exec = ~/.config/polybar/wifi.sh
interval = 15

[module/date]
type = internal/date
interval = 5
date = %H:%M %d/%m
label = %date%

[module/pulseaudio]
type = internal/pulseaudio
interval = 5
label-volume = VOL %percentage%%
label-muted = VOL muted
label-muted-foreground = ${colors.disabled}

[settings]
screenchange-reload = true
pseudo-transparency = false
